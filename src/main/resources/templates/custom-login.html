<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Sistemas | Autenticação</title>
    <style>
        :root {
            --primary: #0066ff;
            --primary-hover: #0052cc;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --error-bg: #451a1a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            background-image:
                radial-gradient(at 0% 0%, rgba(0, 102, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 102, 255, 0.1) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
            margin: 0 0 8px 0;
        }

        .logo span {
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.25);
            background-color: rgba(15, 23, 42, 0.8);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .error-container {
            background-color: var(--error-bg);
            border: 1px solid var(--error);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-text {
            color: #fca5a5;
            font-size: 13px;
            margin: 0;
            font-weight: 500;
        }

        .footer-text {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="header">
        <h1 class="logo">STACK<span>SISTEMAS</span></h1>
        <p class="subtitle">Identidade Corporativa Unificada</p>
    </div>

    <!-- Mensagem de erro elegante -->
    <div th:if="${param.error}" class="error-container">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p class="error-text">Usuário ou senha incorretos.</p>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Usuário Institucional</label>
            <input type="text" id="username" name="username" required autofocus placeholder="Ex: admin" />
        </div>

        <div class="form-group">
            <label for="password">Senha de Acesso</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>

        <button type="submit">Acessar Painel</button>
    </form>

    <div class="footer-text">
        &copy; 2026 Stack Sistemas. Todos os direitos reservados.
    </div>
</div>

</body>
</html>
